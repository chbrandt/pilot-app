name: Release

# Release workflow for production artifact publishing.
# Required GitHub settings:
#   - GITHUB_TOKEN: provided automatically by GitHub Actions
#   - permissions: contents: write, packages: write
#   - allows pushing the pilot-app image to ghcr.io
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: pilot-app
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/pilot-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          regex='^v(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){0,2}(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'
          if [[ ! "$tag" =~ $regex ]]; then
            echo "::error::Tag '$tag' is not a valid release tag. Expected forms like v2, v1.7, v1.2.3, v2-alpha, v1.7-rc, v1.2.3-pr.1"
            exit 1
          fi
          echo "Release tag '$tag' is valid."

      - name: Set release version
        id: release_vars
        run: |
          echo "tag=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pilot-app Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ steps.release_vars.outputs.tag }}
            ${{ env.IMAGE_REPO }}:latest
